// ---------- 네트워크 (PeerJS: 서버 없이 P2P, GitHub Pages에서 동작) ----------
function hostRoom(){if(!USER)return;isHost=true;code=[...Array(4)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
peer=new Peer(PFX+code);

peer.on('connection',c=>{c.on('data',m=>onMsg(c,m));c.on('close',()=>drop(c))});
peer.on('disconnected',()=>peer.reconnect());
peer.on('error',e=>{if(e.type=='unavailable-id')hostRoom();else toast('연결 오류: '+e.type)})}
function joinRoom(c){if(!USER)return;peer=new Peer();let ok=0;
peer.on('open',()=>{conn=peer.connect(PFX+c,{reliable:true});
conn.on('open',()=>{ok=1;conn.send({t:'join',pid:me,name,w:myW,d:DEV})});
conn.on('data',m=>{if(m.t=='s')render(m.v);if(m.t=='e')sfx(m.k);if(m.t=='c')onChat(m.x);if(m.t=='ch'){chat=m.l;drawChat()}if(m.t=='err'){toast(m.m);setTimeout(()=>location.reload(),1500)}});
conn.on('close',()=>{toast('호스트와 연결이 끊어졌습니다');setTimeout(()=>location.reload(),2000)});
setTimeout(()=>{if(!ok){toast('방을 찾을 수 없어요');peer.destroy()}},9000)});
peer.on('error',e=>toast(e.type=='peer-unavailable'?'방을 찾을 수 없어요':'연결 오류: '+e.type))}
function onMsg(c,m){if(m.t=='join'){let p=S.players.find(p=>p.id==m.pid);
if(!p){if(S.players.length>=MAX)return c.send({t:'err',m:'방이 가득 찼어요 (최대 12명)'});p=addP(m.pid,String(m.name).slice(0,10))}
p.conn=c;p.away=false;p.w=cw(m.w);p.dev=!!m.d;c.pid=m.pid;sync();c.send({t:'ch',l:S.chat})}
else if(m.t=='chat'){const p=S.players.find(p=>p.id==c.pid),t=String(m.m).trim().slice(0,120);if(p&&t)say(p,t)}
else if(m.t=='w'){const p=S.players.find(p=>p.id==c.pid);if(p){p.w=cw(m.w);p.dev=!!m.d;sync()}}
else if(m.t=='act'){const p=S.players.find(p=>p.id==c.pid);if(p)doAct(p,m.a,m.n)}}
function drop(c){const p=S.players.find(p=>p.conn==c);if(!p)return;if(S.phase=='lobby')S.players=S.players.filter(q=>q!=p);else{p.away=true;p.conn=null}sync()}
function addP(id,nm,bot){const p={id,name:nm,chips:START,cards:[],bet:0,total:0,folded:false,allin:false,acted:false,in:false,last:'',bot,conn:null,away:false};S.players.push(p);return p}
const send=(a,n)=>isHost?doAct(S.players[0],a,n):conn.send({t:'act',a,n});
function view(id){const rev=S.phase=='show'&&S.res&&S.res.rev;
return{code:S.code,hand:S.hand,ph:S.phase,board:S.board,dealer:S.dealer,turn:S.turn,cur:S.cur,min:S.min,me:id,host:S.players[0].id,res:S.res,winner:S.winner,wid:S.wid,wt:S.wt,cfg:{ante:ANTE,tl:TL/1000,start:START,minr:MINR},
pot:S.players.reduce((a,p)=>a+p.total,0),tl:S.turn>=0&&S.dl?Math.max(0,S.dl-Date.now()):0,
players:S.players.map(p=>({id:p.id,name:p.name,chips:p.chips,bet:p.bet,folded:p.folded,allin:p.allin,bot:p.bot,in:p.in,away:p.away,last:p.last,nr:p.nr,w:p.w,dev:p.dev,
cards:p.in?(p.id==id||(rev&&!p.folded)?p.cards:[-1,-1]):[]}))}}
function sync(){S.players.forEach(p=>p.conn&&p.conn.open&&p.conn.send({t:'s',v:view(p.id)}));render(view(me))}
// ---------- 게임 로직 (호스트 전용) ----------
const BN=['Ace','King','Queen','Jack','Joker','Lucky','Shark','Bluff','Rook','Vegas','Dealer'];
function addBot(){if(S.players.length>=MAX)return toast('최대 12명이에요');const u=BN.filter(n=>!S.players.some(p=>p.name==n));addP('bot'+Math.random().toString(36).slice(2,6),u[0]||'Bot',1);sync()}
function startHand(){clearTimeout(tm);const alive=S.players.filter(p=>p.chips>0).length;S.players=S.players.filter(p=>p.bot?p.chips>0:!p.away);
const P=S.players,n=P.length,el=P.filter(p=>p.chips>0);
if(el.length<2){S.winner=el[0]&&el[0].name;S.wt=el[0]?Math.random().toString(36).slice(2,10):null;S.wid=el[0]&&!el[0].bot&&alive==1?el[0].id:null;P.forEach(p=>{p.chips=START;p.in=false});S.phase='lobby';S.res=null;S.board=[];return sync()}
S.winner=null;S.wid=S.wt=null;S.hand++;S.res=null;S.board=[];S.phase='pre';S.dl=0;
const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}S.deck=d;
P.forEach(p=>{const e=p.chips>0;Object.assign(p,{cards:e?[d.pop(),d.pop()]:[],bet:0,total:0,folded:false,allin:false,acted:false,nr:false,in:e,last:''});
if(e){const a=Math.min(ANTE,p.chips);p.chips-=a;p.total+=a;if(!p.chips)p.allin=true}});
let i=S.dealer;do{i=(i+1)%n}while(!P[i].in);S.dealer=i;S.cur=0;S.min=MINR;S.turn=i;adv()}
const put=(p,x)=>{x=Math.min(x,p.chips);p.chips-=x;p.bet+=x;p.total+=x;if(!p.chips)p.allin=true};
function act(p,a,n){S.tn++;clearTimeout(tm);const to=S.cur-p.bet;if(a=='raise'&&p.nr)a='call';
if(a=='fold'){p.folded=true;p.last='폴드'}
else{const t=a=='raise'?Math.min(Math.max(n|0,S.cur+S.min),p.bet+p.chips):S.cur;
if(t<=S.cur){put(p,Math.min(to,p.chips));p.last=to>0?'콜':'체크'}
else{const was=S.cur;put(p,t-p.bet);const inc=p.bet-was;
if(inc>=S.min){S.min=inc;S.players.forEach(q=>{if(q!=p){q.acted=false;q.nr=false}})}else S.players.forEach(q=>{if(q!=p&&q.acted)q.nr=true});
S.cur=Math.max(S.cur,p.bet);p.last=(was?'레이즈 ':'베팅 ')+p.bet}}
if(p.allin)p.last='ALL-IN';p.acted=true;ev(p.last)}
function doAct(p,a,n){if(S.phase=='lobby'||S.phase=='show'||S.players[S.turn]!=p)return;act(p,a,n);adv()}
function adv(){const P=S.players,n=P.length;if(P.filter(p=>p.in&&!p.folded).length==1)return showdown();
for(let k=1;k<=n;k++){const i=(S.turn+k)%n,p=P[i];if(p.in&&!p.folded&&!p.allin&&(!p.acted||p.bet<S.cur)){S.turn=i;return turnStart()}}street()}
function street(){const P=S.players;if(S.board.length==5)return showdown();
P.forEach(p=>{p.bet=0;p.acted=false;p.nr=false;if(!p.folded&&!p.allin)p.last=''});S.cur=0;S.min=MINR;
S.deck.pop();for(let i=S.board.length?1:3;i--;)S.board.push(S.deck.pop());
S.phase=['pre','pre','pre','flop','turn','river'][S.board.length];
const can=P.filter(p=>p.in&&!p.folded&&!p.allin);
if(can.length<2){S.turn=-1;S.dl=0;sync();const h=S.hand;return void(tm=setTimeout(()=>{if(S.hand==h)street()},1500))}
S.turn=S.dealer;adv()}
function turnStart(){clearTimeout(tm);const p=S.players[S.turn],h=S.hand,tn=++S.tn;
const d=p.bot?(900+Math.random()*1000)*(DEV?ST.bs||1:1):p.away?500:TL;S.dl=p.bot||p.away||!TL?0:Date.now()+TL;sync();if(!d)return;
tm=setTimeout(()=>{if(S.hand!=h||S.tn!=tn||S.players[S.turn]!=p)return;if(p.bot)bot(p);else{act(p,S.cur>p.bet?'fold':'call');adv()}},d)}
function bot(p){const to=S.cur-p.bet;let s;
if(!S.board.length){const a=p.cards[0]%13,b=p.cards[1]%13;s=Math.max(a,b)/20+(a==b?.5:0)+((p.cards[0]/13|0)==(p.cards[1]/13|0)?.08:0)}
else s=(best([...p.cards,...S.board])/759375|0)/6+.25;
s+=Math.random()*.25-.1;let a='call',n=0;
if(!to){if(s>.65&&Math.random()<.6){a='raise';n=S.cur+Math.max(S.min,20)*(1+(Math.random()*3|0))}}
else if(s<.4&&to>Math.max(ANTE,MINR))a='fold';
